# Minimal Grafana config for LOCAL mode — passed via --config so Grafana never
# reads the root-owned /etc/grafana/grafana.ini (which a normal user can't open).
# Data/logs paths are supplied by run_local.sh via GF_PATHS_* env vars.

[paths]
provisioning = /mnt/c/VIT_CHENNAI/Computer_science/Internship/ChronoSense/observability/local/grafana/provisioning

[server]
http_port = 3000

[security]
admin_user = admin
admin_password = admin

[auth.anonymous]
enabled = true
org_role = Viewer

[log]
mode = console
level = warn

[analytics]
reporting_enabled = false
check_for_updates = false
