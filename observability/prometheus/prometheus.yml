# Prometheus scrape + alerting config for ChronoSense.
global:
  scrape_interval: 5s        # scrape targets every 5s (near-live dashboards)
  evaluation_interval: 5s    # evaluate alert rules every 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The Temporal RAG API exposes /metrics (see observability/metrics.py).
  - job_name: chronosense-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8001"]

  # Prometheus scraping itself (handy for sanity checks).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
